[package]
name = "rua-lsp"
version = "0.1.0"
edition = "2021"
description = "Language server for rua: diagnostics, hover, completion and highlighting from the real front end"
license = "MIT"

[dependencies]
rua-syntax = { path = "../rua-syntax", version = "0.1.0" }
rua-core = { path = "../rua-core", version = "0.1.0" }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
