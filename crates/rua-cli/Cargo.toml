[package]
name = "rua-cli"
version = "0.1.0"
edition = "2021"
description = "the rua command line interpreter"
license = "MIT"

[[bin]]
name = "rua"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
mimalloc = "0.1.52"
rua = { path = "../..", version = "0.1.0" }
thiserror = "2.0.20"
